<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WaitGoogle microphone</title>
<link rel="stylesheet" href="voice.css">
</head>
<body>
<main>
<h1>WaitGoogle microphone</h1>
<p>Chrome transcribes your question on this device. Stop the microphone when you finish speaking, then review the text before returning to WaitGoogle.</p>
<label class="live-option"><input id="live-qa" type="checkbox"> Answer shopping questions as I speak</label>
<button id="listen">Start local transcription</button>
<p role="status"></p>
<label for="transcript">Transcript</label>
<textarea id="transcript" rows="4" maxlength="1500"></textarea>
<button id="use-transcript" disabled>Use transcript</button>
</main>
<section id="live-section" aria-labelledby="answers-title" hidden>
<h2 id="answers-title">Live answers</h2>
<div id="live-answers" role="log" aria-live="polite"></div>
<p id="live-status" aria-live="polite"></p>
</section>
<script type="module" src="voice.js"></script>
</body>
</html>
